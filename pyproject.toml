[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kgupc-pol2dom"
version = "0.1.0"
description = "KGUPC Polygon-to-DOMjudge integration using the shared PDF toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["kgupc-toolkit>=1.0.0,<2.0.0", "p2d==0.4.0"]

[project.scripts]
kgupc-pol2dom = "kgupc_pol2dom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kgupc_pol2dom"]
namespaces = false
